name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and generate Javadoc with Maven
        run: mvn -B clean package --file pom.xml

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Build failed: ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Budowanie projektu Maven zakończyło się niepowodzeniem.

            Repozytorium: ${{ github.repository }}
            Branch / PR: ${{ github.ref_name }}
            Autor: ${{ github.actor }}
            Commit: ${{ github.sha }}

            Logi błędu:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
